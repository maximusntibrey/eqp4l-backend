[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Django Meta.constraints lists and plain data models are idiomatic; __str__ only where shown to people.
"*/models.py" = ["RUF012", "DJ008"]
"*/views.py" = ["RUF012"]  # DRF class attributes (permission_classes ...)

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["environ"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
filterwarnings = ["ignore:No directory at:UserWarning"]
addopts = "-q --cov=. --cov-report=term-missing:skip-covered --cov-fail-under=90"

[tool.coverage.run]
omit = ["tests/*", "*/migrations/*", "manage.py", "config/wsgi.py", "config/asgi.py"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", "docs", "backups"]

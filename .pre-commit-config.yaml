repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: secret-check
        name: block committed secrets
        entry: bash scripts/secret-check.sh
        language: system
        types: [text]

# CI (steps G.5, T.15, O1.3). Runs on every pull request and on pushes to main and develop.
# The job runs the pre-commit hooks, a full-history gitleaks scan and the single check
# command (bash scripts/check.sh) against a PostgreSQL service container, then the scripted
# backup and restore test (T.14).
# The job name "check" is the required status check for branch protection (G.6).
# Every action is pinned to a commit SHA (tag in the comment). Versions and
# vetting are recorded in SKILLS.md Appendix A.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PRE_COMMIT_VERSION: "4.7.0"
  GITLEAKS_VERSION: "8.30.1"
  # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the official release
  # gitleaks_8.30.1_checksums.txt (matches the GitHub release asset digest).
  # Update together with GITLEAKS_VERSION.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # Real PostgreSQL for the tests and the migration check (DevOps s5, O1.3).
    # Same major version as local development; pinned by digest (tag in the comment).
    services:
      postgres:
        image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015  # 18.7-alpine
        env:
          POSTGRES_DB: eqp4l
          POSTGRES_USER: eqp4l
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eqp4l -d eqp4l"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # CI-only dummy values for the throwaway service above. Real secrets never live here.
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgres://eqp4l:ci-only-not-a-secret@127.0.0.1:5432/eqp4l
      TIME_ZONE: Africa/Accra

    steps:
      - name: Check out (full history for the secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install pre-commit (pinned, own venv so it cannot change the project pins)
        run: |
          python -m venv "$RUNNER_TEMP/pre-commit-venv"
          "$RUNNER_TEMP/pre-commit-venv/bin/python" -m pip install "pre-commit==${PRE_COMMIT_VERSION}"

      - name: Pre-commit hooks on all files
        # gitleaks is run on the full history in the next step (its hook only
        # scans staged changes). no-commit-to-branch only applies to local commits.
        env:
          SKIP: gitleaks,no-commit-to-branch
        run: '"$RUNNER_TEMP/pre-commit-venv/bin/pre-commit" run --all-files --show-diff-on-failure'

      - name: Secret scan of the full git history (gitleaks, pinned SHA-256)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "$base/$tarball"
          (cd "$RUNNER_TEMP" && echo "$GITLEAKS_SHA256  $tarball" | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .

      - name: Install the pinned requirements (hash-checked)
        run: |
          python -m pip install --require-hashes -r requirements/base.txt -r requirements/dev.txt
          python -m pip check

      - name: Check command (bash scripts/check.sh, T.15)
        # ruff, ruff format, mypy, bandit, pip-audit, Django system check,
        # missing-migration check, pytest with coverage against the PostgreSQL service.
        run: bash scripts/check.sh

      - name: Restore test (scripts/restore-test.sh, T.14)
        # Backup, restore into a fresh database and compare counts and checksums, using
        # the Compose db service (same pinned image). Host port 5433 because the service
        # container above already holds 5432. The .env is the dummy .env.example; the
        # throwaway Compose project is removed afterwards.
        env:
          POSTGRES_PORT: "5433"
        run: |
          cp .env.example .env
          docker compose up -d --wait db
          bash scripts/restore-test.sh
      - name: Remove the restore-test containers and volume
        if: always()
        run: docker compose down -v
